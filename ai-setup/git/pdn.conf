# Настройка проверки на персональные данные. Глобальные значения по умолчанию.
# В отдельном проекте можно переопределить: .ai/pdn.conf в корне репозитория.

# режим:
#   выкл     — не проверять вообще (репозиторий заведомо без данных пациентов)
#   обычный  — жёсткие признаки ловятся всегда, мягкие только в сочетании
#   строгий  — любой мягкий признак тоже останавливает (проекты с выгрузками)
режим = обычный

# Сколько разных ФИО в одном файле считать списком пациентов.
порог-фио = 10

# Отключить правило для пути. Путь — префикс, правило — из списка:
# СНИЛС, полис ОМС, паспорт, телефон, ФИО, ФИО полное, дата рождения,
# адрес, номер карты, формат выгрузки, имя файла.
# Пример:
# не-проверять = fos-data.json: ФИО
